<head>
<style>
  body {
    margin: 0;
    height: 300vh; /* allow scroll */
    font-family: monospace;
  }

  /* Layout viewport (100vw / 100vh) */
  #layoutBox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    border: 4px solid red;
    box-sizing: border-box;
    pointer-events: none;
  }

  /* Visual viewport box */
  #visualBox {
    position: fixed;
    border: 2px solid lime;
    box-sizing: border-box;
    pointer-events: none;
  }

  #info {
    position: fixed;
    top: 10px;
    left: 10px;
    background: black;
    color: white;
    padding: 10px;
    z-index: 9999;
  }
</style>
</head>

<body>

<div id="layoutBox"></div>
<div id="visualBox"></div>

<div id="info"></div>

<script>
const visualBox = document.getElementById('visualBox');
const info = document.getElementById('info');

function update() {
  const layoutW = window.innerWidth;
  const layoutH = window.innerHeight;

  let visualW, visualH, offsetLeft, offsetTop;

  if (window.visualViewport) {
    visualW = visualViewport.width;
    visualH = visualViewport.height;
    offsetLeft = visualViewport.offsetLeft;
    offsetTop = visualViewport.offsetTop;
  } else {
    visualW = layoutW;
    visualH = layoutH;
    offsetLeft = 0;
    offsetTop = 0;
  }

  // position visual viewport box
  visualBox.style.width = visualW + "px";
  visualBox.style.height = visualH + "px";
  visualBox.style.transform = `translate(${offsetLeft}px, ${offsetTop}px)`;

  info.textContent =
    `layout: ${layoutW} x ${layoutH}\n` +
    `visual: ${visualW} x ${visualH}\n` +
    `offset: (${offsetLeft}, ${offsetTop})\n` +
    `client: ${document.documentElement.clientWidth} x ${document.documentElement.clientHeight}`;
}

update();

window.addEventListener('resize', update);
window.addEventListener('scroll', update);

if (window.visualViewport) {
  visualViewport.addEventListener('resize', update);
  visualViewport.addEventListener('scroll', update);
}
</script>

</body>
